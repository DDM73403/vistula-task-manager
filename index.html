<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Task Manager</h1>

    <p id="student-id">73403</p>

    <form id="task-form">
        <input
            id="task-title"
            type="text"
            placeholder="Task Title"
            required>

        <input
            id="task-description"
            type="text"
            placeholder="Task Description">

        <button
            id="task-submit"
            type="submit">
            Save Task
        </button>
    </form>

    <div id="status-message"></div>

    <div id="task-list"></div>

    <a id="contribution-link" href="contribution.html">
        Team Contribution
    </a>

    <script src="app.js"></script>

</body>
</html>
